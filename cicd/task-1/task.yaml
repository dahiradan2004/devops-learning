name: Basic CI pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: install pip
        run: pip install pytest

      - name: test calc.py
        run: pytest task-1

      
